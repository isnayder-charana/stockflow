# Consulta la base cada 4 horas para que el plan gratuito de Aiven no la apague por inactividad.
# De paso despierta la API en Render. Usa el secreto STOCKFLOW_API_URL (el mismo de las alertas).
name: Mantener despierto

on:
  schedule:
    - cron: "17 */4 * * *" # cada 4 horas (minuto 17 para evitar la hora punta de GitHub)
  workflow_dispatch: {} # botón "Run workflow" para probarlo a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Consultar la base a través de la API
        # Render dormido tarda cerca de un minuto en responder: se reintenta varias veces.
        run: curl -fsS --retry 6 --retry-delay 20 --retry-all-errors --max-time 120 "${STOCKFLOW_API_URL%/}/health/db"
        env:
          STOCKFLOW_API_URL: ${{ secrets.STOCKFLOW_API_URL }}
